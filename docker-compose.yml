# Podzial na ETL i API jest kluczowa decyzja architektoniczna:
#   etl  - stanowy, ciezki, uruchamiany raz dziennie (CronJob w K8s)
#   api  - BEZSTANOWY, lekki, skalowany poziomo, caly stan to artefakt indeksu
services:
  db:
    image: postgis/postgis:17-3.5
    # Domyslne 64 MB na /dev/shm nie wystarcza. Postgres trzyma tam segmenty
    # pamieci dzielonej dla workerow zapytan rownoleglych, a kontrole jakosci
    # skanuja staging w calosci. Przy 4 wojewodztwach przechodzilo; przy
    # komplecie 16 (8,6 mln punktow) planer wchodzi w tryb rownolegly i przebieg
    # przerywa sie na "could not resize shared memory segment ... No space left
    # on device". Nie ma to zwiazku z miejscem na dysku hosta.
    shm_size: 1gb
    environment:
      POSTGRES_USER: adres
      POSTGRES_PASSWORD: adres
      POSTGRES_DB: adres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migracje NIE ida przez docker-entrypoint-initdb.d.
      #
      # Dwie drogi wgrywania schematu to dwie prawdy o tym, co baza ma.
      # initdb nie zapisuje niczego w rejestrze migracji, wiec po nim
      # `npm run migrate` widzialby wszystko jako brakujace i probowal
      # wgrac drugi raz. Do tego initdb uruchamia pliki alfabetycznie
      # i bez mozliwosci reakcji na blad - 003 przerywala tam caly start
      # kontenera, przez co swiezy wolumen w ogole nie wstawal.
      #
      # Po `docker compose up -d db` uruchom: npm run migrate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adres"]
      interval: 5s
      retries: 20

  redis:
    # Rate limiting, cache geokodowania odwrotnego, pub/sub o nowej wersji
    # artefaktu. NIE sluzy do wyszukiwania - to robi indeks w RAM.
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --save "" --appendonly no

  minio:
    # Object storage na wersjonowane artefakty indeksu i archiwum surowych
    # ZIP-ow z PRG. Archiwum jest polisa na zniknięcie zrodla - patrz README.
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: adres
      MINIO_ROOT_PASSWORD: adresadres
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: { context: ., dockerfile: Dockerfile, target: api }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://adres:adres@db:5432/adres
      INDEX_SOURCE: /data/index/current.bin
      INDEX_POINTER: /data/index/current.json
      INDEX_POLL_MS: "60000"
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    volumes: ["./data:/data:ro"]
    # Indeks zajmuje ~500-600 MB RSS. Przy wielu podach to realny koszt -
    # alternatywa jest SQLite FTS5 (56 MB pliku, p50 0,06-0,58 ms).
    deploy:
      resources:
        limits: { memory: 1G }

  etl:
    build: { context: ., dockerfile: Dockerfile, target: etl }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://adres:adres@db:5432/adres
      ARCHIVE_ROOT: /data/archive
      INDEX_ROOT: /data/index
    volumes: ["./data:/data"]
    profiles: ["tools"]   # uruchamiany na zadanie: docker compose run --rm etl ...

  # ---------------------------------------------------------------------
  # Stos monitorujacy - profil "monitoring".
  #
  #   docker compose --profile monitoring up -d
  #
  # Aplikacja wystawiala 17 metryk i miala 6 regul alertow, ale nie bylo
  # NICZEGO, co by je zbieralo. Jedynym sposobem sprawdzenia stanu bylo
  # reczne odpytanie /status - tak wlasnie wykryto osmiogodzinny przebieg
  # bez konca, czyli nie wykryto go wcale, zglosil go czlowiek.
  #
  # Za profilem, bo caly stos to ~500 MB RAM, a przy przetwarzaniu pamiec
  # jest potrzebna gdzie indziej.
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerty.yaml:/etc/prometheus/alerty.yaml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["monitoring"]
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["monitoring"]
    depends_on: [prometheus]
    environment:
      # Pulpit ma byc widoczny od razu, bez logowania - to instalacja lokalna.
      # Przed wdrozeniem wlaczyc uwierzytelnianie.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/pulpit-operacyjny.json
    volumes:
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/grafana/pulpit-operacyjny.json:/etc/grafana/provisioning/dashboards/pulpit-operacyjny.json:ro
      - grafanadata:/var/lib/grafana
    ports: ["3001:3000"]

volumes: { pgdata: {}, miniodata: {}, promdata: {}, grafanadata: {} }
