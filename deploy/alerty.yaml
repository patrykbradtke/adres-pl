# Reguly alertow Prometheusa.
# Kazda odpowiada konkretnemu, udokumentowanemu scenariuszowi awarii.
groups:
  - name: adres-pl
    rules:
      - alert: DaneAdresoweZamrozone
        expr: adres_dane_wiek_dni > 30
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: "Najnowszy zrzut PRG ma {{ $value | humanize }} dni"
          description: >
            PRG aktualizuje sie na biezaco. Brak nowego zrzutu przez ponad 30 dni
            oznacza zatrzymanie pipeline'u albo problem po stronie zrodla.
            Dokladnie taki incydent wystapil w czerwcu 2024 i zostal wykryty
            przez firme zewnetrzna, a nie przez instytucje prowadzaca rejestr.

      - alert: PublikacjaWstrzymana
        expr: adres_etl_ostatni_status_info{status="wstrzymany"} == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Kontrole jakosci wstrzymaly publikacje"
          description: >
            To NIE jest awaria - zabezpieczenie zadzialalo i poprzedni zrzut
            pozostaje aktywny. Wymaga jednak decyzji czlowieka: sprawdz /status,
            zweryfikuj przyczyne i albo popraw dane, albo swiadomie opublikuj
            z flaga --force.

      - alert: IndeksNiespojnyZDanymi
        expr: adres_indeks_niespojny == 1
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Artefakt indeksu starszy niz opublikowane dane"
          description: >
            Podpowiedzi beda niespojne z wynikami walidacji. Najczestsza przyczyna
            to nieudana podmiana artefaktu albo instancja, ktora nie pobrala
            nowej wersji.

      - alert: IndeksNieZaladowany
        expr: adres_indeks_zaladowany == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Instancja bez zaladowanego indeksu"

      - alert: BazaNiedostepna
        expr: adres_baza_dostepna == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Baza danych nie odpowiada"
          description: >
            Podpowiedzi beda dzialac dalej, bo indeks jest w pamieci procesu.
            Przestana natomiast dzialac numery budynkow, walidacja i geokodowanie
            odwrotne.

      # PROG PRZELICZONY 9.08.2026 na danych calego kraju.
      #
      # Poprzednio 25 ms, z wartoscia odniesienia 1,84 ms - obie liczby
      # pochodzily ze zbioru syntetycznego, ktory projekt sam wycofal.
      # Zmierzone na 8,6 mln punktow, po rozgrzewce:
      # p50 1,71 ms, p95 9,41 ms, p99 27,94 ms przez pelna sciezke HTTP.
      #
      # SPROSTOWANIE 9.08.2026: te liczby byly tu przypisane skryptowi
      # bench-realny.ts, ktory ich dac nie moze - mierzy idx.search()
      # bezposrednio, bez routingu, hookow i serializacji. Pochodza z pomiaru
      # doraznego. Przyrzad mierzacy pelny cykl zycia zadania powstal jako
      # packages/api/test/bench-http.ts (npm run bench).
      # Stary prog odpalilby sie natychmiast po wdrozeniu.
      #
      # 60 ms to ok. 2x zmierzone p99 - lapie realna degradacje, a nie
      # normalna prace. Przeliczyc ponownie po zadaniu 2.11 (rozgrzewanie
      # instancji), bo powinno scisnac ogon rozkladu.
      - alert: WysokaLatencjaPodpowiedzi
        expr: >
          histogram_quantile(0.99,
            sum(rate(adres_zapytanie_ms_bucket{endpoint="/v1/suggest"}[5m])) by (le)) > 60
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "99. percentyl podpowiedzi powyzej 60 ms"
          description: >
            Wartosc odniesienia na pelnym kraju to 27,94 ms (p99, HTTP).
            Przekroczenie 60 ms sugeruje wyczerpanie pamieci, swapowanie
            albo zbyt duzy artefakt. Uwaga: swiezo uruchomiona instancja
            ma pierwsze zapytania rzedu 80 ms zanim sie rozgrzeje - jesli
            alert zapala sie po kazdym wdrozeniu, to jest to objaw braku
            rozgrzewania, a nie degradacji.

      # Pierwsza linia obrony przed cicha awaria zbierania metryk: jesli
      # Prometheus przestanie widziec mikroserwis, wszystkie powyzsze reguly
      # milkna i cisza wyglada identycznie jak stan zdrowy.
      - alert: BrakMetrykZSerwisu
        expr: up{job="adres-api"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus nie zbiera metryk z mikroserwisu"
          description: >
            Dopoki to trwa, pozostale reguly nie moga sie zapalic niezaleznie
            od stanu uslugi. Brak alertow NIE oznacza wtedy, ze jest dobrze.
